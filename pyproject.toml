[project]
name = "gfe-demo"
version = "0.1.0"
description = "Da Vinci PCT Good Faith Estimate (GFE) responder: turns pricing data into FHIR GFE Bundles and GFE Packets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
gfe-demo = "gfe_service.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gfe_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
